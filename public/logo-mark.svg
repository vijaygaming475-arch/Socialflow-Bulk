<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="sf-grad-primary" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="sf-grad-secondary" x1="110" y1="10" x2="20" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38EFFF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="bg-plate" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Plate with subtle border -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bg-plate)" stroke="#1E293B" stroke-width="2"/>
  <rect x="6" y="6" width="108" height="108" rx="28" fill="none" stroke="url(#sf-grad-primary)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Calendar / Schedule Grid Accents (Top subtle dots) -->
  <circle cx="34" cy="24" r="2.5" fill="#38BDF8" fill-opacity="0.8" />
  <circle cx="48" cy="24" r="2.5" fill="#38BDF8" fill-opacity="0.8" />
  <circle cx="62" cy="24" r="2.5" fill="#38BDF8" fill-opacity="0.8" />
  <rect x="76" y="22.5" width="12" height="3" rx="1.5" fill="#00F0FF" fill-opacity="0.9" />

  <!-- Stylized "S" + "F" + Video Play Element -->
  <!-- Upper Curve of S flowing into F top bar -->
  <path d="M 38 48 C 38 38 46 32 60 32 L 86 32 C 89 32 91 34 91 37 C 91 40 89 42 86 42 L 62 42 C 54 42 48 45 48 50 C 48 56 54 58 64 61 L 72 63 C 85 67 92 73 92 82 C 92 93 82 99 66 99 L 34 99 C 31 99 29 97 29 94 C 29 91 31 89 34 89 L 66 89 C 75 89 81 86 81 81 C 81 76 75 73 66 70 L 58 68 C 45 64 38 58 38 48 Z" fill="url(#sf-grad-primary)"/>

  <!-- F Stem and Horizontal Crossbar integrating subtle play triangle -->
  <path d="M 68 44 L 88 44 C 90 44 91 45.5 91 47.5 C 91 49.5 90 51 88 51 L 68 51 Z" fill="#38EFFF"/>
  
  <!-- Dynamic Play Triangle embedded within the central nexus -->
  <polygon points="56,54 74,65 56,76" fill="#00F0FF" filter="url(#sf-glow)" opacity="0.95"/>
  <polygon points="56,54 74,65 56,76" fill="#FFFFFF" opacity="0.3"/>
</svg>

