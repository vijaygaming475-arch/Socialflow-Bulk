<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="logo-text-grad" x1="100" y1="20" x2="360" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="285" y1="28" x2="355" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="sf-grad" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mark Container -->
  <g transform="translate(6, 6) scale(0.65)">
    <rect x="6" y="6" width="108" height="108" rx="28" fill="#0C1322" stroke="#1E293B" stroke-width="2"/>
    <rect x="6" y="6" width="108" height="108" rx="28" fill="none" stroke="url(#sf-grad)" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Top schedule dots -->
    <circle cx="34" cy="24" r="2.5" fill="#38BDF8" fill-opacity="0.8" />
    <circle cx="48" cy="24" r="2.5" fill="#38BDF8" fill-opacity="0.8" />
    <circle cx="62" cy="24" r="2.5" fill="#38BDF8" fill-opacity="0.8" />
    <rect x="76" y="22.5" width="12" height="3" rx="1.5" fill="#00F0FF" fill-opacity="0.9" />

    <!-- SF Glyph -->
    <path d="M 38 48 C 38 38 46 32 60 32 L 86 32 C 89 32 91 34 91 37 C 91 40 89 42 86 42 L 62 42 C 54 42 48 45 48 50 C 48 56 54 58 64 61 L 72 63 C 85 67 92 73 92 82 C 92 93 82 99 66 99 L 34 99 C 31 99 29 97 29 94 C 29 91 31 89 34 89 L 66 89 C 75 89 81 86 81 81 C 81 76 75 73 66 70 L 58 68 C 45 64 38 58 38 48 Z" fill="url(#sf-grad)"/>
    <path d="M 68 44 L 88 44 C 90 44 91 45.5 91 47.5 C 91 49.5 90 51 88 51 L 68 51 Z" fill="#38EFFF"/>
    
    <!-- Play Triangle -->
    <polygon points="56,54 74,65 56,76" fill="#00F0FF" filter="url(#mark-glow)" opacity="0.95"/>
    <polygon points="56,54 74,65 56,76" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Brand Typography -->
  <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.5" fill="url(#logo-text-grad)">
    SocialFlow
  </text>

  <!-- Bulk Badge -->
  <g transform="translate(236, 31)">
    <rect x="0" y="0" width="58" height="26" rx="6" fill="#0E1E38" stroke="#0284C7" stroke-width="1"/>
    <rect x="0" y="0" width="58" height="26" rx="6" fill="url(#badge-grad)" opacity="0.15"/>
    <text x="29" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#00F0FF" text-anchor="middle">
      BULK
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="97" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.5" fill="#64748B">
    Desktop Video Automation
  </text>
</svg>

